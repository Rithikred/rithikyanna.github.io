/* ── useInView ── */
function useInView(threshold = 0.12) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVis(true); obs.disconnect(); } }, { threshold });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, vis];
}

function FadeIn({ children, delay = 0, style = {} }) {
  const [ref, vis] = useInView();
  return (
    <div ref={ref} className={vis ? 'anim-in' : 'anim-ready'} style={{ animationDelay:`${delay}ms`, ...style }}>
      {children}
    </div>
  );
}

                  onFocus={e => e.target.style.borderColor='var(--accent)'} onBlur={e => e.target.style.borderColor='var(--border)'} />
              </div>
              <textarea placeholder="What are you working on?" required rows={5} value={form.message} onChange={e => setForm({...form, message:e.target.value})}
                style={{...inp, resize:'vertical'}}
                onFocus={e => e.target.style.borderColor='var(--accent)'} onBlur={e => e.target.style.borderColor='var(--border)'} />
              <button type="submit" style={{
                alignSelf:'flex-start', padding:'13px 30px',
                background:'var(--accent)', color:'#fff', border:'none', borderRadius:9,
                fontWeight:600, fontSize:14.5, cursor:'pointer',
                boxShadow:'0 4px 18px color-mix(in srgb, var(--accent) 30%, transparent)',
                transition:'all 0.22s'
              }}
              onMouseEnter={e => e.currentTarget.style.transform='translateY(-2px)'}
              onMouseLeave={e => e.currentTarget.style.transform=''}
              >Send message →</button>
            </form>
          )}
        </FadeIn>
        <FadeIn delay={160}>
          <div style={{ marginTop:60, paddingTop:40, borderTop:'1px solid var(--border)', display:'flex', flexWrap:'wrap', gap:'28px 48px' }}>
            {[
              { label:'Email',    display:'Rithikreddy0210@gmail.com',                      href:'mailto:Rithikreddy0210@gmail.com' },
              { label:'Phone',    display:'417-444-2948',                                    href:'tel:4174442948' },
              { label:'LinkedIn', display:'linkedin.com/in/rithik-yanna-6b1b1a24b',         href:'https://www.linkedin.com/in/rithik-yanna-6b1b1a24b/' },
              { label:'GitHub',   display:'github.com/rithikyanna',                          href:'https://github.com/rithikyanna' },
            ].map(l => (
              <div key={l.label}>
                <p style={{ fontSize:11, fontWeight:700, letterSpacing:1.5, textTransform:'uppercase', color:'var(--muted)', marginBottom:6 }}>{l.label}</p>
                <a href={l.href} target={l.href.startsWith('http') ? '_blank' : undefined}
                  style={{ fontSize:13.5, color:'var(--accent)', textDecoration:'none', fontWeight:500, transition:'opacity 0.15s' }}
                  onMouseEnter={e => e.target.style.opacity='0.65'}
                  onMouseLeave={e => e.target.style.opacity='1'}
                >{l.display}</a>
              </div>
            ))}
          </div>
        </FadeIn>
      </div>
    </section>
  );
}

}

/* ── APP ── */
function App() {
  const [dark, setDark] = useState(false);
  const [accent, setAccent] = useState('#7c3aed');

  useEffect(() => {
    document.documentElement.setAttribute('data-dark', String(dark));
  }, [dark]);

  useEffect(() => {
    document.documentElement.style.setProperty('--accent', accent);
    document.documentElement.style.setProperty('--accent-lt', dark ? '#2e1f5e' : accent + '22');
  }, [accent, dark]);

  return (
    <>
      <Nav dark={dark} setDark={setDark} />
      <main>
        <Hero />
        <Skills />
        <Experience />
        <Education />
        <Tools />
        <Contact />
      </main>
      <Footer />

      {/* Accent picker */}
      <div style={{
        position:'fixed', bottom:24, right:24, zIndex:300,
        background:'var(--surface)', border:'1px solid var(--border)',
        borderRadius:12, padding:'10px 14px',
        display:'flex', alignItems:'center', gap:10, boxShadow:'0 4px 20px rgba(0,0,0,0.12)'
      }}>
        <span style={{ fontSize:11, color:'var(--muted)', fontWeight:600, letterSpacing:1, textTransform:'uppercase' }}>Accent</span>
        {['#7c3aed','#2563eb','#0891b2','#059669','#dc2626','#ea580c'].map(c => (
          <button key={c} onClick={() => setAccent(c)} title={c} style={{
            width:20, height:20, borderRadius:'50%', background:c, border:'none',
            cursor:'pointer', outline: accent===c ? `2px solid ${c}` : 'none',
            outlineOffset:2, transition:'transform 0.15s',
            transform: accent===c ? 'scale(1.2)' : 'scale(1)'
          }} />
        ))}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
